<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#c00018">
<title>Pra você 🥺</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    background: linear-gradient(135deg, #ff1e3c 0%, #c00018 50%, #8a0010 100%);
    background-size: 200% 200%;
    animation: bgShift 8s ease infinite;
    color: #fff;
    position: relative;
  }
  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* corações flutuando no fundo */
  #hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .heart {
    position: absolute;
    bottom: -60px;
    font-size: 28px;
    opacity: 0.85;
    animation: floatUp linear infinite;
    will-change: transform;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg) scale(.8); opacity: 0; }
    10%  { opacity: .9; }
    90%  { opacity: .9; }
    100% { transform: translateY(-110vh) rotate(360deg) scale(1.2); opacity: 0; }
  }

  .screen {
    position: relative;
    z-index: 1;
    height: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .screen.active { display: flex; animation: fadeIn .5s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(.96);} to {opacity:1; transform:scale(1);} }

  .big-emoji {
    font-size: 110px;
    line-height: 1;
    margin-bottom: 18px;
    animation: bob 2s ease-in-out infinite;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,.35));
  }
  /* moldura das figurinhas (imagens) */
  .emoji-frame {
    width: clamp(160px, 46vw, 230px);
    border-radius: 28px;
    overflow: hidden;
    margin-bottom: 20px;
    border: 4px solid rgba(255,255,255,.9);
    box-shadow: 0 12px 30px rgba(0,0,0,.45);
    animation: bob 2.4s ease-in-out infinite;
    background: #ff7a1a;
  }
  .emoji-frame img { width: 100%; height: auto; display: block; }
  /* figurinhas desenhadas em SVG */
  .big-emoji-svg {
    width: clamp(160px, 46vw, 220px);
    height: auto;
    margin-bottom: 18px;
    animation: bob 2.2s ease-in-out infinite;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.45));
  }
  /* figurinha real (PNG com fundo transparente) */
  .emoji-photo {
    width: clamp(170px, 48vw, 225px);
    height: auto;
    display: block;
    margin-bottom: 18px;
    animation: bob 2.2s ease-in-out infinite;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.45));
  }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50%     { transform: translateY(-14px) rotate(3deg); }
  }

  h1 {
    font-size: clamp(26px, 7vw, 44px);
    font-weight: 800;
    margin-bottom: 10px;
    text-shadow: 0 3px 10px rgba(0,0,0,.4);
    line-height: 1.2;
  }
  .sub {
    font-size: clamp(15px, 4.2vw, 20px);
    font-weight: 500;
    opacity: .95;
    margin-bottom: 30px;
    max-width: 420px;
    line-height: 1.4;
  }

  .btn-row { display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; }

  .btn {
    border: none;
    border-radius: 50px;
    padding: 16px 38px;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(0,0,0,.28);
    transition: transform .15s ease, background .2s ease;
  }
  .btn:active { transform: scale(.95); }
  .btn-yes {
    background: #fff;
    color: #d10018;
  }
  .btn-yes:hover { transform: scale(1.05); }
  .btn-no {
    background: rgba(0,0,0,.35);
    color: #fff;
    border: 2px solid rgba(255,255,255,.6);
  }
  .teasing { font-size: 14px; opacity: .9; margin-top: 18px; min-height: 20px; font-weight: 600; }

  /* tela do formulário */
  .card {
    background: rgba(255,255,255,.12);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 22px;
    padding: 26px 22px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 12px 30px rgba(0,0,0,.3);
  }
  .field { text-align: left; margin-bottom: 22px; }
  .field label { display: block; font-weight: 700; font-size: 16px; margin-bottom: 10px; }
  input[type="datetime-local"] {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    color: #c00018;
    font-weight: 600;
    background: #fff;
    cursor: pointer;
  }
  input[type="datetime-local"]::-webkit-calendar-picker-indicator { cursor: pointer; }
  .food-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .food {
    background: rgba(255,255,255,.15);
    border: 2px solid rgba(255,255,255,.35);
    border-radius: 14px;
    padding: 14px 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    transition: all .15s ease;
  }
  .food:active { transform: scale(.96); }
  .food.selected {
    background: #fff;
    color: #d10018;
    border-color: #fff;
    transform: scale(1.03);
    box-shadow: 0 6px 16px rgba(0,0,0,.25);
  }
  .food-emoji { font-size: 26px; display: block; margin-bottom: 4px; }

  .send-btn {
    margin-top: 8px;
    width: 100%;
    background: #25D366;
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 16px;
    font-size: 19px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(0,0,0,.28);
    transition: transform .15s ease, opacity .2s;
  }
  .send-btn:active { transform: scale(.97); }
  .send-btn:disabled { opacity: .45; cursor: not-allowed; }

  .next-btn {
    margin-top: 26px;
    background: #fff;
    color: #d10018;
    border: none;
    border-radius: 50px;
    padding: 15px 44px;
    font-size: 19px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(0,0,0,.28);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }

  .hint { font-size: 12px; opacity: .8; margin-top: 14px; }
</style>
</head>
<body>

<!-- TELA 3: formulário -->
<section class="screen" id="screen3">
  <h1 style="font-size:clamp(24px,6.5vw,38px); margin-bottom:18px;">Qual o melhor dia? 📅</h1>
  <div class="card">
    <div class="field">
      <label>🚗 Quando eu posso te buscar?</label>
      <input type="datetime-local" id="quando">
    </div>
    <div class="field">
      <label>🍽️ O que vc quer comer?</label>
      <div class="food-grid">
        <button class="food" data-food="🍔 Hambúrguer"><span class="food-emoji">🍔</span>Hambúrguer</button>
        <button class="food" data-food="🍣 Sushi"><span class="food-emoji">🍣</span>Sushi</button>
        <button class="food" data-food="🍝 Massas"><span class="food-emoji">🍝</span>Massas</button>
        <button class="food" data-food="🍕 Pizza"><span class="food-emoji">🍕</span>Pizza</button>
        <button class="food" data-food="✨ Outros" style="grid-column:1/3;"><span class="food-emoji">✨</span>Outros</button>
      </div>
    </div>
    <button class="send-btn" id="sendBtn" disabled>Enviar no WhatsApp 💬</button>
    <p class="hint">vai abrir o WhatsApp com a mensagem prontinha 😉</p>
  </div>
</section>

<script>
  /* ---------- corações no fundo ---------- */
  (function makeHearts(){
    const wrap = document.getElementById('hearts');
    const emojis = ['❤️','💖','💘','💕','💗','🩷'];
    const n = 22;
    for (let i = 0; i < n; i++){
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      h.style.left = Math.random()*100 + 'vw';
      h.style.fontSize = (18 + Math.random()*26) + 'px';
      h.style.animationDuration = (6 + Math.random()*8) + 's';
      h.style.animationDelay = (Math.random()*8) + 's';
      wrap.appendChild(h);
    }
  })();

  /* ---------- usa a figurinha REAL se existir na pasta (senão fica o SVG) ---------- */
  (function trocarPorFoto(){
    function tentar(svgId, base){
      const svg = document.getElementById(svgId);
      if (!svg) return;
      const exts = ['.png', '.jpg', '.jpeg', '.webp'];
      let i = 0;
      const img = new Image();
      img.className = 'emoji-photo';
      img.alt = base;
      img.onload = function(){
        svg.parentNode.insertBefore(img, svg);
        svg.style.display = 'none';
      };
      img.onerror = function(){
        i++;
        if (i < exts.length) img.src = base + exts[i];
        // se não achar nenhuma, mantém o desenho SVG
      };
      img.src = base + exts[0];
    }
    tentar('emoji1', 'implorando');
    tentar('emoji2', 'sapeca');
  })();

  /* ---------- botão NÃO fujão ---------- */
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const teasing = document.getElementById('teasing');
  const frases = [
    'kkkk não adianta 😜',
    'tenta de novo vai 😏',
    'esse botão é escorregadio 🫣',
    'o destino quer que vc clique no Sim 💖',
    'desiste, vai ser mais fácil kk',
    'tá com medo? 🥺',
    'só tem uma resposta certa aqui 👀'
  ];
  let count = 0;
  let floating = false;

  function fugir(){
    if (!floating){
      // congela o tamanho do botão e passa pra posição fixa
      const r = noBtn.getBoundingClientRect();
      noBtn.style.position = 'fixed';
      noBtn.style.left = r.left + 'px';
      noBtn.style.top = r.top + 'px';
      noBtn.style.margin = '0';
      floating = true;
    }
    const w = noBtn.offsetWidth, h = noBtn.offsetHeight;
    const pad = 12;
    const maxX = window.innerWidth - w - pad;
    const maxY = window.innerHeight - h - pad;
    const x = pad + Math.random() * (maxX - pad);
    const y = pad + Math.random() * (maxY - pad);
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';

    // cresce o Sim a cada fuga (efeito cômico)
    count++;
    const scale = Math.min(1 + count*0.12, 2.2);
    yesBtn.style.transform = 'scale(' + scale + ')';
    teasing.textContent = frases[Math.min(count-1, frases.length-1)];
  }

  // PC: foge ao aproximar o mouse
  noBtn.addEventListener('mouseover', fugir);
  noBtn.addEventListener('mousemove', fugir);
  // celular/PC: foge ao tentar tocar/clicar
  noBtn.addEventListener('touchstart', function(e){ e.preventDefault(); fugir(); }, {passive:false});
  noBtn.addEventListener('click', function(e){ e.preventDefault(); fugir(); });
  // foge também se o dedo/mouse chega perto na tela
  document.getElementById('screen1').addEventListener('pointermove', function(e){
    if (!floating) return;
    const r = noBtn.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
    if (dist < 90) fugir();
  });

  /* ---------- SIM -> tela 2 ---------- */
  yesBtn.addEventListener('click', function(){
    showScreen('screen2');
  });

  /* ---------- Próximo -> tela 3 ---------- */
  document.getElementById('nextBtn').addEventListener('click', function(){
    showScreen('screen3');
    // libera o scroll no form caso a tela seja pequena
    document.documentElement.style.overflow = 'auto';
  });

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  /* ---------- formulário ---------- */
  let comida = null;
  const sendBtn = document.getElementById('sendBtn');
  const quando = document.getElementById('quando');

  document.querySelectorAll('.food').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.food').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      comida = b.dataset.food;
      checar();
    });
  });
  quando.addEventListener('change', checar);
  quando.addEventListener('input', checar);
  // abre o seletor ao clicar em qualquer lugar do campo (nao so no iconezinho)
  function abrirSeletor(){ try { quando.showPicker(); } catch(e){} }
  quando.addEventListener('click', abrirSeletor);
  quando.addEventListener('focus', abrirSeletor);

  function checar(){
    sendBtn.disabled = !(quando.value && comida);
  }

  function formatarData(v){
    // v = "2026-06-20T19:30"
    if (!v) return '';
    const [d, t] = v.split('T');
    const [ano, mes, dia] = d.split('-');
    return `${dia}/${mes}/${ano} às ${t}h`;
  }

  sendBtn.addEventListener('click', function(){
    const numero = '5562982412403'; // 55 (BR) + 62 + número
    const msg =
      '💖 Eu disse SIM! 💖\n\n' +
      '🚗 Pode me buscar: ' + formatarData(quando.value) + '\n' +
      '🍽️ Quero comer: ' + comida + '\n\n' +
      '(caí na sua pegadinha 🥺➡️😏🌹 kk)';
    const url = 'https://wa.me/' + numero + '?text=' + encodeURIComponent(msg);
    window.location.href = url;
  });
</script>
</body>
